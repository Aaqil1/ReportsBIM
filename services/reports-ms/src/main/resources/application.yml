server:
  port: 8082

spring:
  application:
    name: reports-ms
  datasource:
    url: jdbc:postgresql://${ARCHIVE_DB_HOST:localhost}:${ARCHIVE_DB_PORT:5432}/archivedb
    username: ${ARCHIVE_DB_USER:archivedb_user}
    password: ${ARCHIVE_DB_PASSWORD:archivedb_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reports-ms-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      max-in-flight-requests-per-connection: 1
      enable-idempotence: true

logging:
  level:
    root: INFO
    com.edjobim.reports: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
