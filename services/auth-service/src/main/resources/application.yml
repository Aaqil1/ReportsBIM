server:
  port: 8081

spring:
  application:
    name: auth-service

logging:
  level:
    root: INFO
    com.edjobim.auth: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
