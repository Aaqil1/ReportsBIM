{{- if .Values.reportsMs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-ms
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edjo-bim.labels" . | nindent 4 }}
    component: reports-ms
spec:
  replicas: {{ .Values.reportsMs.replicas }}
  selector:
    matchLabels:
      {{- include "edjo-bim.selectorLabels" . | nindent 6 }}
      component: reports-ms
  template:
    metadata:
      labels:
        {{- include "edjo-bim.selectorLabels" . | nindent 8 }}
        component: reports-ms
    spec:
      containers:
      - name: reports-ms
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.reportsMs.image }}:{{ .Values.global.imageTag }}"
        ports:
        - containerPort: {{ .Values.reportsMs.port }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.kafka.bootstrapServers | quote }}
        - name: ARCHIVE_DB_HOST
          value: "postgres"
        - name: ARCHIVE_DB_PORT
          value: "5432"
        - name: ARCHIVE_DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: ARCHIVE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          {{- toYaml .Values.reportsMs.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.reportsMs.port }}
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.reportsMs.port }}
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reports-ms
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- include "edjo-bim.selectorLabels" . | nindent 4 }}
    component: reports-ms
  ports:
  - port: {{ .Values.reportsMs.port }}
    targetPort: {{ .Values.reportsMs.port }}
{{- end }}
