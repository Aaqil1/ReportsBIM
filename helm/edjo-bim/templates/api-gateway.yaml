{{- if .Values.apiGatewayBff.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-bff
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edjo-bim.labels" . | nindent 4 }}
    component: api-gateway-bff
spec:
  replicas: {{ .Values.apiGatewayBff.replicas }}
  selector:
    matchLabels:
      {{- include "edjo-bim.selectorLabels" . | nindent 6 }}
      component: api-gateway-bff
  template:
    metadata:
      labels:
        {{- include "edjo-bim.selectorLabels" . | nindent 8 }}
        component: api-gateway-bff
    spec:
      containers:
      - name: api-gateway-bff
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.apiGatewayBff.image }}:{{ .Values.global.imageTag }}"
        ports:
        - containerPort: {{ .Values.apiGatewayBff.port }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.kafka.bootstrapServers | quote }}
        - name: JWT_JWKS_URI
          value: "http://auth-service:{{ .Values.authService.port }}/oauth2/jwks"
        - name: SERVICES_PERFORMANCE_URL
          value: "http://client-performance-svc:{{ .Values.clientPerformanceSvc.port }}"
        - name: SERVICES_AIMS_CONFIG_URL
          value: "http://aims-config-central:{{ .Values.aimsConfigCentral.port }}"
        resources:
          {{- toYaml .Values.apiGatewayBff.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.apiGatewayBff.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.apiGatewayBff.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-bff
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.apiGatewayBff.serviceType }}
  selector:
    {{- include "edjo-bim.selectorLabels" . | nindent 4 }}
    component: api-gateway-bff
  ports:
  - port: 80
    targetPort: {{ .Values.apiGatewayBff.port }}
{{- end }}
