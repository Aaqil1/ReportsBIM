{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edjo-bim.labels" . | nindent 4 }}
    component: auth-service
spec:
  replicas: {{ .Values.authService.replicas }}
  selector:
    matchLabels:
      {{- include "edjo-bim.selectorLabels" . | nindent 6 }}
      component: auth-service
  template:
    metadata:
      labels:
        {{- include "edjo-bim.selectorLabels" . | nindent 8 }}
        component: auth-service
    spec:
      containers:
      - name: auth-service
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.authService.image }}:{{ .Values.global.imageTag }}"
        ports:
        - containerPort: {{ .Values.authService.port }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        resources:
          {{- toYaml .Values.authService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.authService.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.authService.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- include "edjo-bim.selectorLabels" . | nindent 4 }}
    component: auth-service
  ports:
  - port: {{ .Values.authService.port }}
    targetPort: {{ .Values.authService.port }}
{{- end }}
