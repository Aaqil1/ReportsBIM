apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-ms
  namespace: edjo-bim
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reports-ms
  template:
    metadata:
      labels:
        app: reports-ms
    spec:
      containers:
      - name: reports-ms
        image: your-registry.io/edjo-bim/reports-ms:1.0.0
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: ARCHIVE_DB_HOST
          value: "postgres"
        - name: ARCHIVE_DB_PORT
          value: "5432"
        - name: ARCHIVE_DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: ARCHIVE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reports-ms
  namespace: edjo-bim
spec:
  selector:
    app: reports-ms
  ports:
  - port: 8082
    targetPort: 8082
