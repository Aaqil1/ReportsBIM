apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-bff
  namespace: edjo-bim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-bff
  template:
    metadata:
      labels:
        app: api-gateway-bff
    spec:
      containers:
      - name: api-gateway-bff
        image: your-registry.io/edjo-bim/api-gateway-bff:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: JWT_JWKS_URI
          value: "http://auth-service:8081/oauth2/jwks"
        - name: SERVICES_PERFORMANCE_URL
          value: "http://client-performance-svc:8083"
        - name: SERVICES_AIMS_CONFIG_URL
          value: "http://aims-config-central:8084"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-bff
  namespace: edjo-bim
spec:
  type: LoadBalancer
  selector:
    app: api-gateway-bff
  ports:
  - port: 80
    targetPort: 8080
